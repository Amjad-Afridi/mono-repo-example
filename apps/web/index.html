<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD App</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
      #root { max-width: 980px; margin: 0 auto; padding: 30px 20px 40px; }
      .app { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
      .card { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
      h1, h2, h3, p { margin-top: 0; }
      input, textarea, button { font: inherit; }
      label { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; font-weight: 600; }
      input, textarea { border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; }
      button { border: none; border-radius: 10px; background: #2563eb; color: white; padding: 10px 14px; cursor: pointer; }
      button.secondary { background: #e5e7eb; color: #111827; }
      button.danger { background: #dc2626; }
      .item-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
      .item { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; gap: 16px; }
      .item-actions { display: flex; gap: 8px; align-items: center; }
      .status { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: bold; }
      .error { color: #b91c1c; font-weight: 600; }
      @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
